name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: notenportal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      # Das Schema nutzt CHECK-Constraints und Composite-FKs – nur MariaDB/MySQL, kein SQLite.
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: notenportal_test
      DB_USERNAME: root
      DB_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer-Abhängigkeiten
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Stil (Pint)
        run: vendor/bin/pint --test

      - name: Oberfläche bauen
        run: |
          npm ci
          npm run build

      - name: Kein ß in den Views
        run: '! grep -rn "ß" resources/views/'

      - name: Umgebung
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test
